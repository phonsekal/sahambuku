name: Pindai The Launch Pad (pola buku Bab 6.2)

# Kenapa pola ini perlu cron, padahal sudah ada kriteria screener-nya:
# The Launch Pad adalah pola dengan bukti TERKUAT di aplikasi (uji 5 tahun universe
# SANGAT LIKUID: alpha20 +6,05%, absolut +5,06%, holdout dua paruh positif) sekaligus
# yang paling JARANG (~1,2 kejadian/hari se-pasar). Syaratnya — base menyempit +
# breakout + volume ≥1,5× MA20 — hanya benar di SATU titik waktu, jadi melewatkan
# sehari berarti sinyalnya hilang, bukan tertunda.
#
# Dijalankan setelah bursa tutup (~17:40 WIB) supaya data hari itu sudah final.
on:
  schedule:
    - cron: "40 10 * * 1-5"   # 10:40 UTC = 17:40 WIB, Senin-Jumat
  workflow_dispatch: {}

jobs:
  pindai-launchpad:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Panggil endpoint /api/cron/launchpad
        run: |
          set -euo pipefail
          echo "Memindai The Launch Pad pada $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          code=$(curl -sS --max-time 300 -o resp_launchpad.json -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://sahambuku.vercel.app/api/cron/launchpad?universe=liquid&limit=45")
          echo "HTTP $code"
          cat resp_launchpad.json
          echo
          if [ "$code" != "200" ]; then
            echo "::error::Endpoint Launch Pad membalas HTTP $code"
            exit 1
          fi
          echo "Selesai."
