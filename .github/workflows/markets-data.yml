name: Data & Ukur Pasar AS + Crypto

# KENAPA CRON INI ADA DI LUAR VERCEL:
# Screener IDX dilayani dari daftar emiten + kuota IDX Edge, tetapi untuk AS & crypto
# tidak ada sumber seperti itu: setiap ticker = satu panggilan jaringan. Vercel tidak
# boleh dipakai untuk itu — function-nya berbatas 10-60 detik dan Yahoo membatasi IP
# datacenter. Jadi penarikan OHLCV massal dijalankan di runner GitHub Actions, dan
# hasil ukurnya ditulis ke berkas laporan yang di-commit.
#
# TAHAP INI ADALAH TAHAP UKUR (sesuai keputusan proyek: "ukur dulu, baru bangun menu").
# Yang diproduksi adalah TABEL HASIL, bukan menu aplikasi.
#
# RATE LIMIT ITU NYATA DAN SUDAH TERUKUR: pada percobaan pertama, hanya ~23 dari 99
# potongan yang berhasil (1.339 dari 5.896 ticker). Tiga penangkalnya:
#   1. potongan BESAR (chunk 250 -> ~24 permintaan, bukan 99);
#   2. SWEEP — ticker yang belum dapat dicoba ulang dalam kelompok kecil dgn jeda;
#   3. CACHE checkpoint antar-run (actions/cache) supaya run berikutnya MELANJUTKAN,
#      bukan mengulang dari nol. Karena itu cakupan bertambah tiap minggu.
#
# TOLERANSI GAGAL: setiap pasar berdiri sendiri (continue-on-error) dan langkah
# penyimpanan laporan berjalan `if: always()`, sehingga kegagalan satu pasar tidak
# lagi menghapus laporan pasar yang sudah berhasil — itu yang terjadi di percobaan
# pertama, ketika jalur crypto gagal dan laporan AS ikut hilang dari commit.
on:
  schedule:
    - cron: "0 22 * * 0"        # Minggu 22:00 UTC (Senin 05:00 WIB), setelah bursa AS tutup
  workflow_dispatch:
    inputs:
      market:
        description: "Pasar yang diukur"
        required: true
        default: "both"
        type: choice
        options: ["both", "us", "crypto"]
      us_limit:
        description: "Batasi jumlah saham AS (kosong = seluruh pasar)"
        required: false
        default: ""
      crypto_top:
        description: "Jumlah crypto teratas"
        required: false
        default: "100"

permissions:
  contents: write

jobs:
  tarik-dan-ukur:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pasang dependensi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Cache checkpoint data harga antar-run: inilah yang membuat cakupan
      # bertambah dari minggu ke minggu meski Yahoo membatasi tiap run.
      - name: Pulihkan cache data pasar
        uses: actions/cache@v4
        with:
          path: research/.cache/markets
          key: markets-${{ github.run_id }}
          restore-keys: |
            markets-

      - name: Tentukan pasar
        id: m
        run: |
          echo "market=${{ github.event.inputs.market || 'both' }}" >> "$GITHUB_OUTPUT"
          echo "us_limit=${{ github.event.inputs.us_limit || '' }}" >> "$GITHUB_OUTPUT"
          echo "crypto_top=${{ github.event.inputs.crypto_top || '100' }}" >> "$GITHUB_OUTPUT"

      - name: Tarik + ukur saham AS
        if: steps.m.outputs.market == 'both' || steps.m.outputs.market == 'us'
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p research/markets/reports
          LIM="${{ steps.m.outputs.us_limit }}"
          ARGS=(--market us --period 5y --chunk 250)
          if [ -n "$LIM" ]; then ARGS+=(--limit "$LIM"); fi
          python research/markets/pull.py "${ARGS[@]}" 2>&1 | tee research/markets/reports/pull_us.log || true
          if [ -f research/.cache/markets/us_panel.pkl ]; then
            python research/markets/study.py --market us 2>&1 | tee research/markets/reports/report_us.txt || true
          else
            echo "Panel AS tidak terbentuk — laporan dilewati (lihat pull_us.log)" \
              | tee research/markets/reports/report_us.txt
          fi

      - name: Tarik + ukur crypto
        if: steps.m.outputs.market == 'both' || steps.m.outputs.market == 'crypto'
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p research/markets/reports
          python research/markets/pull.py --market crypto --period 5y \
            --top "${{ steps.m.outputs.crypto_top }}" --chunk 25 \
            2>&1 | tee research/markets/reports/pull_crypto.log || true
          if [ -f research/.cache/markets/crypto_panel.pkl ]; then
            python research/markets/study.py --market crypto 2>&1 | tee research/markets/reports/report_crypto.txt || true
          else
            echo "Panel crypto tidak terbentuk — laporan dilewati (lihat pull_crypto.log)" \
              | tee research/markets/reports/report_crypto.txt
          fi

      # Ekspor yang dibutuhkan runtime: snapshot harga ringkas (hanya pasar yang
      # memang dipasang, saat ini crypto) + ringkasan hasil ukur untuk endpoint
      # /api/markets/study dan tab dashboard. AS sengaja TIDAK diekspor penuh
      # (puluhan MB) dan belum punya aturan yang lolos.
      - name: Ekspor snapshot + ringkasan ukur
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          if [ -f research/.cache/markets/crypto_panel.pkl ]; then
            # 220 bar = cukup untuk SMA200 & indikator yang dipakai, tetapi tetap
            # kecil (<1 MB) supaya repo tidak membengkak karena snapshot mingguan.
            python research/markets/export.py --market crypto --bars 220 2>&1 | tee -a research/markets/reports/export.log || true
          else
            echo "Panel crypto tidak ada — ekspor dilewati" | tee -a research/markets/reports/export.log
          fi
          python research/markets/summary.py 2>&1 | tee -a research/markets/reports/export.log || true

      # Selalu jalan: laporan pasar yang berhasil tidak boleh hilang karena pasar lain gagal.
      - name: Simpan laporan ukur ke repo
        if: always()
        run: |
          set -uo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # api/market_crypto_meta.json HARUS ikut: dulu ia tertinggal, sehingga repo
          # menyimpan meta lama (74/260) sementara CSV & ringkasannya sudah 91/220 —
          # cakupan di dashboard jadi bisa berbeda dari isi snapshot yang sebenarnya.
          git add research/markets/reports api/market_crypto.csv \
            api/market_crypto_meta.json api/market_study.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan laporan."
          else
            git commit -m "Perbarui laporan ukur pasar AS & crypto (otomatis)"
            git push || echo "Push ditolak (mungkin ada perubahan lain) — laporan tetap ada di artefak."
          fi

      - name: Arsipkan laporan (artefak)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-pasar-as-crypto
          path: research/markets/reports/
          if-no-files-found: ignore
